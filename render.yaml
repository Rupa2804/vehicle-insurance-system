
services:
  - type: web
    name: vehicle-insurance-system
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DATABASE
        value: vehicle_insurance_db
